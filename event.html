<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event - Norwich RNA Club</title>
  <meta name="description" content="RNA seminar at Norwich RNA Club">
  <meta name="keywords" content="RNA seminar, RNA talk, RNA lecture, Norwich RNA Club, scientific event">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .event-detail {
      max-width: 900px;
      margin: 0 auto;
    }
    .event-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .event-header h1 {
      font-size: 2.2rem;
      color: var(--primary-color);
      margin-bottom: 20px;
      line-height: 1.3;
    }
    .event-speaker-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    .event-speaker-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--bg-light);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .event-speaker-text h2 {
      font-size: 1.5rem;
      color: var(--secondary-color);
      margin-bottom: 5px;
    }
    .event-speaker-text p {
      color: var(--text-light);
    }
    .event-meta-box {
      background: var(--bg-light);
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 40px;
    }
    .event-meta-box .meta-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }
    .event-meta-box .meta-item:last-child {
      margin-bottom: 0;
    }
    .event-meta-box .meta-icon {
      font-size: 1.3rem;
    }
    .event-poster {
      margin: 40px 0;
      text-align: center;
    }
    .event-poster img {
      max-width: 100%;
      max-height: 600px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .event-description {
      margin: 40px 0;
    }
    .event-description h3 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--primary-color);
    }
    .event-description p {
      color: var(--text-light);
      line-height: 1.8;
      font-size: 1.05rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
      color: var(--secondary-color);
      font-weight: 500;
    }
    .back-link:hover {
      color: var(--primary-color);
    }
    .not-found {
      text-align: center;
      padding: 100px 20px;
    }
    .not-found h1 {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 20px;
    }
    /* Share and Calendar Buttons */
    .event-actions {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid var(--border-color);
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }
    .action-btn-calendar {
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
      color: white;
    }
    .action-btn-calendar:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
      color: white;
    }
    .action-btn-google {
      background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
      color: white;
    }
    .action-btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
      color: white;
    }
    .share-section {
      margin-top: 15px;
    }
    .share-label {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 10px;
    }
    .share-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .share-btn-twitter {
      background: #1da1f2;
      color: white;
    }
    .share-btn-twitter:hover {
      background: #0d8ddb;
      transform: translateY(-2px);
      color: white;
    }
    .share-btn-linkedin {
      background: #0077b5;
      color: white;
    }
    .share-btn-linkedin:hover {
      background: #006195;
      transform: translateY(-2px);
      color: white;
    }
    .share-btn-email {
      background: var(--secondary-color);
      color: white;
    }
    .share-btn-email:hover {
      background: #2980b9;
      transform: translateY(-2px);
      color: white;
    }
    .share-btn-copy {
      background: var(--bg-light);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      cursor: pointer;
    }
    .share-btn-copy:hover {
      background: var(--primary-color);
      color: white;
      transform: translateY(-2px);
    }
    .copy-tooltip {
      position: relative;
    }
    .copy-tooltip::after {
      content: 'Copied!';
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-color);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .copy-tooltip.show::after {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Norwich RNA Club Logo">
      </a>
      <button class="mobile-menu-btn" onclick="toggleMenu()">&#9776;</button>
      <nav class="nav" id="nav">
        <a href="index.html">Home</a>
        <a href="events.html" class="active">Events</a>
        <a href="join.html">Join</a>
      </nav>
    </div>
  </header>

  <!-- Event Detail -->
  <section class="section">
    <div class="container">
      <div class="event-detail" id="event-detail">
        <div class="loading">Loading event...</div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 Norwich RNA Club. All rights reserved.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="join.html">Join</a>
      </div>
      <div class="visitor-stats">
        <span id="busuanzi_container_site_pv">
          访问量: <span id="busuanzi_value_site_pv"></span> 次
        </span>
        <span class="stats-separator">|</span>
        <span id="busuanzi_container_site_uv">
          访客数: <span id="busuanzi_value_site_uv"></span> 人
        </span>
      </div>
    </div>
  </footer>

  <!-- Busuanzi Analytics -->
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    // Mobile menu toggle
    function toggleMenu() {
      document.getElementById('nav').classList.toggle('active');
    }

    // Get URL parameter
    function getUrlParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Load YAML data
    async function loadYAML(file) {
      try {
        const response = await fetch(file);
        const text = await response.text();
        return jsyaml.load(text);
      } catch (error) {
        console.error('Error loading YAML:', error);
        return null;
      }
    }

    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }

    // Generate iCal file content
    function generateICalFile(event) {
      const startDate = new Date(event.date);
      const timeParts = event.time.split(' - ')[0].split(':');
      startDate.setHours(parseInt(timeParts[0]), parseInt(timeParts[1]), 0);

      const endTimeParts = event.time.split(' - ')[1]?.split(':') || timeParts;
      const endDate = new Date(event.date);
      endDate.setHours(parseInt(endTimeParts[0]), parseInt(endTimeParts[1]), 0);

      const formatICalDate = (date) => {
        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      };

      const icalContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Norwich RNA Club//Event//EN
BEGIN:VEVENT
UID:${event.date}@norwichrnaclub
DTSTAMP:${formatICalDate(new Date())}
DTSTART:${formatICalDate(startDate)}
DTEND:${formatICalDate(endDate)}
SUMMARY:${event.title}
DESCRIPTION:Speaker: ${event.speaker}\\n${event.affiliation}\\n\\n${event.description || ''}
LOCATION:${event.location}
END:VEVENT
END:VCALENDAR`;

      return icalContent;
    }

    // Download iCal file
    function downloadICalFile(event) {
      const icalContent = generateICalFile(event);
      const blob = new Blob([icalContent], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `norwich-rna-club-${event.date}.ics`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Generate Google Calendar URL
    function generateGoogleCalendarUrl(event) {
      const startDate = new Date(event.date);
      const timeParts = event.time.split(' - ')[0].split(':');
      startDate.setHours(parseInt(timeParts[0]), parseInt(timeParts[1]), 0);

      const endTimeParts = event.time.split(' - ')[1]?.split(':') || timeParts;
      const endDate = new Date(event.date);
      endDate.setHours(parseInt(endTimeParts[0]), parseInt(endTimeParts[1]), 0);

      const formatGoogleDate = (date) => {
        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      };

      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: event.title,
        dates: `${formatGoogleDate(startDate)}/${formatGoogleDate(endDate)}`,
        details: `Speaker: ${event.speaker}\n${event.affiliation}\n\n${event.description || ''}`,
        location: event.location,
        sf: 'true'
      });

      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    // Copy link to clipboard
    function copyEventLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const copyBtn = document.getElementById('copyLinkBtn');
        copyBtn.classList.add('show');
        setTimeout(() => {
          copyBtn.classList.remove('show');
        }, 2000);
      });
    }

    // Render event detail
    function renderEvent(event) {
      const container = document.getElementById('event-detail');

      // Update page title
      document.title = `${event.title} - Norwich RNA Club`;

      // Generate share URLs
      const pageUrl = encodeURIComponent(window.location.href);
      const shareText = encodeURIComponent(`${event.title} - ${event.speaker} at Norwich RNA Club`);
      const twitterUrl = `https://twitter.com/intent/tweet?text=${shareText}&url=${pageUrl}`;
      const linkedinUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${pageUrl}`;
      const emailSubject = encodeURIComponent(`Norwich RNA Club Event: ${event.title}`);
      const emailBody = encodeURIComponent(`Check out this RNA seminar:\n\n${event.title}\nSpeaker: ${event.speaker}\nDate: ${formatDate(event.date)}\nTime: ${event.time}\nLocation: ${event.location}\n\nMore details: ${window.location.href}`);
      const emailUrl = `mailto:?subject=${emailSubject}&body=${emailBody}`;
      const googleCalendarUrl = generateGoogleCalendarUrl(event);

      // Store event globally for calendar download
      window.currentEvent = event;

      container.innerHTML = `
        <a href="events.html" class="back-link">&#8592; Back to Events</a>

        <div class="event-header">
          <h1>${event.title}</h1>
        </div>

        <div class="event-speaker-info">
          <img src="${event.image}" alt="Photo of ${event.speaker}, speaker at Norwich RNA Club" class="event-speaker-photo" onerror="this.src='images/backgrounds/og-events.jpg'">
          <div class="event-speaker-text">
            <h2>${event.speaker}</h2>
            <p>${event.affiliation}</p>
          </div>
        </div>

        <div class="event-meta-box">
          <div class="meta-item">
            <span class="meta-icon">&#128197;</span>
            <span>${formatDate(event.date)}</span>
          </div>
          <div class="meta-item">
            <span class="meta-icon">&#128337;</span>
            <span>${event.time}</span>
          </div>
          <div class="meta-item">
            <span class="meta-icon">&#128205;</span>
            <span>${event.location}</span>
          </div>

          <!-- Calendar and Share Actions -->
          <div class="event-actions">
            <button onclick="downloadICalFile(window.currentEvent)" class="action-btn action-btn-calendar" title="Download iCal file">
              &#128197; Add to Calendar
            </button>
            <a href="${googleCalendarUrl}" target="_blank" rel="noopener noreferrer" class="action-btn action-btn-google" title="Add to Google Calendar">
              &#128197; Google Calendar
            </a>
          </div>

          <div class="share-section">
            <p class="share-label">Share this event:</p>
            <div class="share-buttons">
              <a href="${twitterUrl}" target="_blank" rel="noopener noreferrer" class="share-btn share-btn-twitter" title="Share on Twitter">
                &#120143;
              </a>
              <a href="${linkedinUrl}" target="_blank" rel="noopener noreferrer" class="share-btn share-btn-linkedin" title="Share on LinkedIn">
                in
              </a>
              <a href="${emailUrl}" class="share-btn share-btn-email" title="Share via Email">
                &#9993;
              </a>
              <button onclick="copyEventLink()" class="share-btn share-btn-copy copy-tooltip" id="copyLinkBtn" title="Copy link">
                &#128279;
              </button>
            </div>
          </div>
        </div>

        ${event.poster ? `
        <div class="event-poster">
          <img src="${event.poster}" alt="Event poster for ${event.title}">
        </div>
        ` : ''}

        ${event.description ? `
        <div class="event-description">
          <h3>About the Speaker</h3>
          <p>${event.description}</p>
        </div>
        ` : ''}

        ${event.abstract ? `
        <div class="event-description">
          <h3>Abstract</h3>
          <p>${event.abstract}</p>
        </div>
        ` : ''}

        <div style="text-align: center; margin-top: 50px;">
          <a href="events.html" class="btn btn-primary">View All Events</a>
        </div>
      `;
    }

    // Render not found
    function renderNotFound() {
      const container = document.getElementById('event-detail');
      container.innerHTML = `
        <div class="not-found">
          <h1>Event Not Found</h1>
          <p>Sorry, we couldn't find the event you're looking for.</p>
          <a href="events.html" class="btn btn-primary" style="margin-top: 20px;">View All Events</a>
        </div>
      `;
    }

    // Initialize
    async function init() {
      const date = getUrlParam('date');

      if (!date) {
        renderNotFound();
        return;
      }

      const data = await loadYAML('data/conferences.yml');

      if (data && data.conferences) {
        const event = data.conferences.find(e => e.date === date);

        if (event) {
          renderEvent(event);
        } else {
          renderNotFound();
        }
      } else {
        renderNotFound();
      }
    }

    init();
  </script>
</body>
</html>
