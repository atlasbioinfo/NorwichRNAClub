<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Norwich RNA Club</title>
  <meta name="description" content="The page you are looking for could not be found.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .error-content {
      max-width: 500px;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 700;
      color: var(--secondary-color);
      line-height: 1;
      margin-bottom: 20px;
      opacity: 0.8;
    }
    .error-title {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 15px;
    }
    .error-message {
      color: var(--text-light);
      font-size: 1.1rem;
      margin-bottom: 30px;
      line-height: 1.7;
    }
    .error-links {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Norwich RNA Club Logo">
      </a>
      <button class="mobile-menu-btn" onclick="toggleMenu()">&#9776;</button>
      <nav class="nav" id="nav">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="join.html">Join</a>
      </nav>
    </div>
  </header>

  <!-- Error Content -->
  <section class="error-page">
    <div class="error-content">
      <div class="error-icon">&#128301;</div>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-message">
        Oops! It seems this RNA sequence has mutated beyond recognition.
        The page you're looking for doesn't exist or has been moved.
      </p>
      <div class="error-links">
        <a href="index.html" class="btn btn-primary">Go Home</a>
        <a href="events.html" class="btn btn-outline" style="border-color: var(--secondary-color); color: var(--secondary-color);">View Events</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 Norwich RNA Club. All rights reserved.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="join.html">Join</a>
      </div>
    </div>
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById('nav').classList.toggle('active');
    }
  </script>
</body>
</html>
